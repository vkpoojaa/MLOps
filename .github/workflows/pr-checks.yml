name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Config, tests, and lightweight pipeline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate YAML configuration
        run: PYTHONPATH=src python -m mlops_pipeline validate-config

      - name: Train model for tests
        run: PYTHONPATH=src python -m mlops_pipeline train

      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q tests/unit --junitxml=reports/phase11-unit-junit.xml

      - name: Run integration tests
        run: PYTHONPATH=src python -m pytest -q tests/integration --junitxml=reports/phase11-integration-junit.xml

      - name: Lightweight pipeline smoke
        run: PYTHONPATH=src python scripts/ci_pipeline_smoke.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-test-reports
          path: reports/
          if-no-files-found: ignore
