name: Main Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    name: Revalidate main before release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate configuration
        run: PYTHONPATH=src python -m mlops_pipeline validate-config
      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q tests/unit
      - name: Run integration tests
        run: PYTHONPATH=src python -m pytest -q tests/integration
      - name: Run lightweight Data Gate pipeline smoke
        run: PYTHONPATH=src python scripts/ci_pipeline_smoke.py

  release-image:
    needs: release-checks
    name: Build and publish commit-traceable API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable release identity
        id: release
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          FULL_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/mlops-house-price-api"
          BASE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          with Path('pyproject.toml').open('rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"
          SHORT_COMMIT="${FULL_COMMIT:0:12}"
          VERSION="${BASE_VERSION}-${SHORT_COMMIT}"
          RELEASE_TAG="v${VERSION}"
          {
            echo "image=${IMAGE}"
            echo "base_version=${BASE_VERSION}"
            echo "version=${VERSION}"
            echo "short_commit=${SHORT_COMMIT}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            IMAGE_NAME=${{ steps.release.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release manifest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          BASE_VERSION: ${{ steps.release.outputs.base_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          FULL_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "release_tag": os.environ["RELEASE_TAG"],
              "application_version": os.environ["BASE_VERSION"],
              "image_version": os.environ["VERSION"],
              "image": os.environ["IMAGE"],
              "image_tags": [
                  f"{os.environ['IMAGE']}:{os.environ['VERSION']}",
                  f"{os.environ['IMAGE']}:sha-{os.environ['FULL_COMMIT']}",
              ],
              "git_commit": os.environ["FULL_COMMIT"],
              "source_ref": os.environ["SOURCE_REF"],
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_attempt": os.environ["RUN_ATTEMPT"],
              "release_scope": "API container only; does not train, register, promote, or deploy a model",
              "production_model_policy": "Only the ML pipeline may promote a model after Data Gate and Model Gate pass",
          }
          Path("release-manifest.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: Project 4 ${{ steps.release.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-manifest.json
          body: |
            Automated API image release from commit `${{ github.sha }}`.

            - Image: `${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - OCI revision label: `${{ github.sha }}`
            - Release manifest: attached to this release.

            This workflow publishes the serving application only. It does not train, register, promote, or deploy a model. Production model changes remain controlled by the ML pipeline's Data Gate and Model Gate.
